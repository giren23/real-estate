<h1>한국은행, 기준금리 3.25% 동결…물가 경계</h1>
<div class="article_body">
<p>한국은행 금융통화위원회는 27일 통화정책방향 회의를 열고 기준금리를 연 3.25%로 유지했다.</p>
<p>물가 상승률이 목표치인 2%를 웃돌고 있어 인하를 서두르기 어렵다고 판단했기 때문이다.</p>
<p>금통위는 내년 1분기 경기 지표를 보고 인하 여부를 검토할 계획이라고 발표했다.</p>
<p>시장에서는 내년 상반기 0.25%p 인하 가능성을 점치는 전망이 나온다.</p>
</div>
