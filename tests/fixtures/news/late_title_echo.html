<body>
<div id="articleBody" class="article-body">
<p>국토교통부는 28일 수도권 유휴부지를 활용한 주택 공급 방안을 내놨다.</p>
<p>이번 방안은 지난해부터 이어진 전세가격 상승에 대응하기 위해 마련됐다.</p>
<p>대상 부지는 경기 남부의 공공 보유 토지 12곳이다.</p>
<p>정부는 공공주택 1만호 공급 계획을 발표하고 2028년까지 착공하겠다고 밝혔다.</p>
<p>세부 입지와 분양가는 아직 확정되지 않았다.</p>
<p>다만 지구단위계획 변경이 늦어지면 착공 시점이 2029년 이후로 밀릴 수 있다.</p>
</div>
