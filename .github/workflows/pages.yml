name: Deploy dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "data/public/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows:
      - "Frequent economic indicators"
      - "Daily real-estate update"
      - "Daily 7AM investment briefing"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p site/data
          cp -r web/* site/
          cp -r data/public/* site/data/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for published artifact metadata
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          url = (os.environ["GH_API_URL"] + "/repos/" + os.environ["GH_REPOSITORY"]
                 + "/actions/runs/" + os.environ["GH_RUN_ID"] + "/artifacts")
          for attempt in range(12):
              request = urllib.request.Request(
                  url,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28",
                           "Cache-Control": "no-cache"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=5) as response:
                      artifacts = json.load(response).get("artifacts", [])
                  if any(item.get("name") == "github-pages" and not item.get("expired")
                         for item in artifacts):
                      print("Pages artifact is available for deployment")
                      break
              except (urllib.error.URLError, TimeoutError) as error:
                  print("Artifact metadata is not ready:", type(error).__name__)
              if attempt == 11:
                  raise SystemExit("Pages artifact metadata remained unavailable; deployment stopped")
              time.sleep(3)
          PY
      - id: deployment
        uses: actions/deploy-pages@v4
