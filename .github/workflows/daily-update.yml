name: Daily real-estate update

on:
  push:
    paths:
      - ".github/workflows/daily-update.yml"
      - "scripts/merge_incremental_public_data.py"
      - "scripts/update_reb_market_map.py"
      - "src/realestate/cli/main.py"
      - "src/realestate/core/regions.py"
      - "tests/test_daily_data_automation.py"
      - "tests/test_incremental_public_merge.py"
      - "tests/test_ranked_news_archive.py"
  schedule:
    # 매일 한국시간 자정 직후인 오전 0시 5분부터 실행 대기(UTC 전날 15시 5분).
    # GitHub Actions의 예약 작업 특성상 실제 시작은 다소 지연될 수 있음.
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-estate-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh nationwide apartment directory
        id: directory
        continue-on-error: true
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          APT_LIST_SERVICE_KEY: ${{ secrets.APT_LIST_SERVICE_KEY }}
          PYTHONPATH: src
        run: python -m realestate.cli.main collect-complexes

      - name: Collect two latest months nationwide
        id: collect
        continue-on-error: true
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          PYTHONPATH: src
        run: >
          python -m realestate.cli.main collect
          --months 2
          --nationwide-coverage
          --failure-report data/reports/trade_collection_failures.json

      - name: Merge latest partitions without deleting published history
        env:
          PYTHONPATH: src
        run: python scripts/merge_incremental_public_data.py

      - name: Build GitHub 84㎡ benchmark snapshot
        env:
          PYTHONPATH: src
        run: python scripts/build_public_area_benchmarks.py

      - name: Refresh regional 84sqm average transaction prices
        run: python scripts/update_reb_market_map.py --local-prices-only

      - name: Test
        id: test
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Upload collection result report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-collection-report-${{ github.run_number }}
          path: data/reports/trade_collection_failures.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit successful regional updates
        run: |
          git config user.name "real-estate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/public data/raw/complexes.csv web/content/reb_market_map.json web/content/news web/content/analysis
          git commit -m "Daily update" || exit 0
          git pull --rebase origin main
          git push

      - name: Mark incomplete refresh as failed after saving successes
        if: steps.directory.outcome == 'failure' || steps.collect.outcome == 'failure' || steps.test.outcome == 'failure'
        run: |
          echo "::error::수집 또는 검증 일부가 실패했습니다. 성공한 데이터는 먼저 게시했고, 아래와 아티팩트에 상세 결과를 남깁니다."
          if [ -f data/reports/trade_collection_failures.json ]; then
            cat data/reports/trade_collection_failures.json
          fi
          exit 1
