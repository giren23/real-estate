name: Daily real-estate update

on:
  schedule:
    # 매일 한국시간 오전 6시 5분(UTC 전날 21시 5분)에 전국 갱신 1회를 실행함.
    - cron: "5 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: real-estate-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Choose normal or monthly reconciliation window
        id: window
        shell: bash
        run: |
          months=2
          if [ "$(TZ=Asia/Seoul date +%d)" = "01" ]; then months=3; fi
          echo "months=$months" >> "$GITHUB_OUTPUT"
          echo "한국 날짜 기준 최근 ${months}개월을 수집합니다."

      - name: Collect latest months nationwide
        id: collect
        continue-on-error: true
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          PYTHONPATH: src
        run: >
          python -m realestate.cli.main collect
          --months ${{ steps.window.outputs.months }}
          --nationwide-coverage
          --failure-report data/reports/trade_collection_failures.json

      - name: Retry failed district-month requests only
        id: retry
        if: steps.collect.outcome == 'failure'
        continue-on-error: true
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          PYTHONPATH: src
        run: >
          python -m realestate.cli.main retry-trades
          --source-report data/reports/trade_collection_failures.json
          --failure-report data/reports/trade_collection_retry.json

      - name: Publish regional collection status
        if: always()
        run: >
          python scripts/publish_collection_status.py
          --initial data/reports/trade_collection_failures.json
          --retry data/reports/trade_collection_retry.json

      - name: Merge latest partitions without deleting published history
        env:
          PYTHONPATH: src
        run: python scripts/merge_incremental_public_data.py

      - name: Build GitHub 84㎡ benchmark snapshot
        env:
          PYTHONPATH: src
        run: python scripts/build_public_area_benchmarks.py

      - name: Build district shards for PC-off mobile use
        env:
          PYTHONPATH: src
        run: python scripts/build_public_trade_shards.py

      - name: Refresh regional 84sqm average transaction prices
        run: python scripts/update_reb_market_map.py --local-prices-only

      - name: Test
        id: test
        continue-on-error: true
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee data/reports/pytest.log

      - name: Publish concise test failure annotation
        if: steps.test.outcome == 'failure'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("data/reports/pytest.log").read_text(encoding="utf-8", errors="replace")[-6000:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=pytest failure::{text}")
          PY

      - name: Upload collection result reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-collection-report-${{ github.run_number }}
          path: |
            data/reports/trade_collection_failures.json
            data/reports/trade_collection_retry.json
            data/reports/pytest.log
            data/public/collection_status.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit verified regional updates
        if: steps.test.outcome == 'success'
        run: |
          git config user.name "real-estate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/public/meta.json data/public/monthly.json data/public/regions.json data/public/area_benchmarks.json data/public/collection_status.json data/public/shards web/content/reb_market_map.json web/content/news web/content/analysis
          git commit -m "Daily update" || exit 0
          git pull --rebase --autostash origin main
          git push

      - name: Mark unresolved refresh as failed after saving successes
        if: steps.test.outcome == 'failure' || (steps.collect.outcome == 'failure' && steps.retry.outcome != 'success')
        run: |
          echo "::error::검증 실패 또는 재시도 후 미해결 지역이 있습니다. 성공한 데이터와 상태 보고서는 게시했습니다."
          if [ -f data/reports/trade_collection_retry.json ]; then
            cat data/reports/trade_collection_retry.json
          else
            cat data/reports/trade_collection_failures.json
          fi
          exit 1
