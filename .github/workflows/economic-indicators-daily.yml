name: Frequent economic indicators

on:
  schedule:
    # 한국시간 07:15, 11:15, 15:15, 19:15, 23:15, 03:15에 실행
    - cron: "15 22 * * *"
    - cron: "15 2 * * *"
    - cron: "15 6 * * *"
    - cron: "15 10 * * *"
    - cron: "15 14 * * *"
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: economic-indicators-frequent
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Refresh all economic indicator series
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
        run: python scripts/update_economic_context.py

      - name: Build daily market snapshot
        run: python scripts/update_market_snapshot.py

      - name: Refresh economic news archive
        continue-on-error: true
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python scripts/update_economic_news.py --backfill-days 2 --limit-per-day 60 --archive-enrich-limit 60

      - name: Refresh company and deep-dive analysis
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update_editorial_analysis.py --lookback-days 45 --company-limit 20 --analysis-limit 20

      - name: Build the archived morning investment briefing
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *'
        run: python scripts/update_investment_briefing.py

      - name: Verify generated data and chart freshness wiring
        run: python -m pytest -q tests/test_economic_context.py tests/test_market_snapshot.py tests/test_latest_chart_values.py tests/test_investment_briefing.py tests/test_research_contract.py

      - name: Commit refreshed indicators
        run: |
          git config user.name "economic-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/public/economic_context.json data/public/market_snapshot.json web/content/news web/content/analysis web/content/investment-briefing
          git commit -m "Frequent economic information update" || exit 0
          git pull --rebase origin main
          git push
