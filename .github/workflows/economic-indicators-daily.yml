name: Frequent economic indicators

on:
  schedule:
    # UTC 기준 3시간마다, 한국시간 00:15부터 3시간 간격으로 하루 8회 실행
    - cron: "15 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/economic-indicators-daily.yml"
      - "scripts/update_economic_news.py"

permissions:
  contents: write

concurrency:
  group: economic-indicators-frequent
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Refresh all economic indicator series
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
        run: python scripts/update_economic_context.py

      - name: Build daily market snapshot
        run: python scripts/update_market_snapshot.py

      - name: Refresh economic news archive
        continue-on-error: true
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python scripts/update_economic_news.py --backfill-days 2 --limit-per-day 60 --archive-enrich-limit 60

      - name: Refresh company and deep-dive analysis
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update_editorial_analysis.py --lookback-days 45 --company-limit 20 --analysis-limit 20

      - name: Refresh listed-company search catalog
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update_stock_catalog.py

      - name: Verify generated data and chart freshness wiring
        id: test
        continue-on-error: true
        run: python -m pytest -q tests/test_economic_context.py tests/test_market_snapshot.py tests/test_latest_chart_values.py tests/test_investment_briefing.py tests/test_research_contract.py

      - name: Commit refreshed indicators
        run: |
          git config user.name "economic-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/public/economic_context.json data/public/market_snapshot.json web/content/news web/content/analysis web/content/investment-briefing web/data/stock_catalog.json
          git commit -m "Frequent economic information update" || exit 0
          git pull --rebase origin main
          git push

      - name: Mark verification failure after publishing generated data
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error::생성 데이터는 저장·배포했지만 검증 테스트가 실패했습니다. 테스트 로그를 확인하세요."
          exit 1
