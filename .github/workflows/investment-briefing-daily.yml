name: Daily 7AM investment briefing

on:
  schedule:
    # 매일 한국시간 오전 7시 정각
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-investment-briefing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build today's clean investment briefing
        run: python scripts/update_investment_briefing.py
      - name: Verify briefing archive
        run: python -m pytest -q tests/test_investment_briefing.py
      - name: Commit today's briefing
        run: |
          git config user.name "investment-briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/content/investment-briefing
          git commit -m "Daily 7AM investment briefing" || exit 0
          git pull --rebase origin main
          git push
