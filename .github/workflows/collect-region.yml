name: Collect Region History

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "Comma-separated 5-digit district codes"
        required: true
        default: "48123"

permissions:
  contents: write

concurrency:
  group: collect-region-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Collect selected district history
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          PYTHONPATH: src
        run: python -m realestate.cli.main collect --all-history --codes "${{ inputs.codes }}"

      - name: Publish
        env:
          PYTHONPATH: src
        run: python -m realestate.cli.main publish

      - name: Test
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Commit generated data
        run: |
          git config user.name "real-estate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/public data/raw/trades
          git commit -m "Update selected district trade history" || exit 0
          git push
