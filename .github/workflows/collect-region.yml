name: Import Changwon Sinwol History

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-region-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Import official Changwon Sinwol-dong history
        env:
          PYTHONPATH: src
        run: python scripts/import_rtms_download.py

      - name: Test
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Commit generated data
        run: |
          git config user.name "real-estate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/public
          git commit -m "Update Changwon Sinwol-dong trade history" || exit 0
          git push
